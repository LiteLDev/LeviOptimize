on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        target_type:
          - server
          - client
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - name: Test chunk optimization helpers
        if: matrix.target_type == 'server'
        run: |
          clang++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -Isrc tests/ChunkOptimizationStateTest.cpp -o ChunkOptimizationStateTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./ChunkOptimizationStateTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -Isrc tests/ChunkGenDispatcherSignatureTest.cpp -o ChunkGenDispatcherSignatureTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./ChunkGenDispatcherSignatureTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -Isrc tests/ChunkCacheSignaturesTest.cpp -o ChunkCacheSignaturesTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./ChunkCacheSignaturesTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -Isrc tests/VanillaWaypointsTest.cpp -o VanillaWaypointsTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./VanillaWaypointsTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang++ -std=c++23 -O2 -DNDEBUG -Wall -Wextra -Werror -Isrc tests/EntityPacketRecipientsTest.cpp -o EntityPacketRecipientsTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./EntityPacketRecipientsTest.exe

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows -v --target_type=${{ matrix.target_type }} -y

      - run: |
          xmake -v -y

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.target_type }}-windows-x64
          path: |
            bin/

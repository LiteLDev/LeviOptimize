format = 4
id = "github.com/LiteLDev/LeviOptimize"
version = "0.18.0"

[info]
name = "LeviOptimize"
description = "A performance optimization mod for Minecraft Bedrock Dedicated Server and the Bedrock client"
tags = ["optimization"]
logo = "https://raw.githubusercontent.com/LiteLDev/LeviOptimize/main/docs/logo.png"

# The default variant installs the server build on a dedicated server and the client build on the
# Bedrock client.
# The client entry depends on the bare LeviLamina: a lip.toml dependency is never rewritten to
# "#client", and lip.toml releases of LeviLamina have no "client" variant. Its range starts above
# 26.60.6, the last tooth.json release of LeviLamina, because the "" variant of a tooth.json release
# is the server build.

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LeviOptimize-server-windows-x64.zip"]
place = [{ src = "LeviOptimize/", dest = "mods/LeviOptimize/" }]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LeviOptimize-client-windows-x64.zip"]
place = [{ src = "LeviOptimize/", dest = "mods/LeviOptimize/" }]

format = 4
id = "github.com/LiteLDev/LeviOptimize"
version = "0.18.0"

[info]
name = "LeviOptimize"
description = "A performance optimization mod for Minecraft Bedrock Dedicated Server and the Bedrock client"
tags = ["optimization"]
logo = "https://raw.githubusercontent.com/LiteLDev/LeviOptimize/main/docs/logo.png"

# The default variant installs the server build on a dedicated server and the client build on the
# Bedrock client.
# The client entry depends on github.com/LiteLDev/LeviLamina#client because LeviLamina 26.60.* is
# released with tooth.json only; switch it to bare github.com/LiteLDev/LeviLamina once a lip.toml
# LeviLamina release is targeted.

[[variants.""]]
side = "server"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LeviOptimize-server-windows-x64.zip"]
place = [{ src = "LeviOptimize/", dest = "mods/LeviOptimize/" }]

[[variants.""]]
side = "client"
platform = "win-x64"

[variants."".deps]
"github.com/LiteLDev/LeviLamina#client" = "26.60.*"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/LeviOptimize-client-windows-x64.zip"]
place = [{ src = "LeviOptimize/", dest = "mods/LeviOptimize/" }]
